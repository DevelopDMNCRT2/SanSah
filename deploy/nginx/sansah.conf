# Configuración Nginx para SanSah Bikes en VPS
# Redirección global HTTP a HTTPS
server {
    listen 80;
    server_name sansahbikes.com www.sansahbikes.com admin.sansahbikes.com api.sansahbikes.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 🌐 Tienda Cliente y Landing
server {
    listen 443 ssl;
    server_name sansahbikes.com www.sansahbikes.com;

    ssl_certificate /etc/letsencrypt/live/sansahbikes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sansahbikes.com/privkey.pem;

    # Proxy inverso para llamadas API desde la tienda
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Landing Page
    location /landing/ {
        proxy_pass http://127.0.0.1:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA Tienda
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 🖥️ Panel de Administración (Admin)
server {
    listen 443 ssl;
    server_name admin.sansahbikes.com;

    ssl_certificate /etc/letsencrypt/live/sansahbikes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sansahbikes.com/privkey.pem;

    # Proxy inverso para autenticación y endpoints API del panel administrativo
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Admin
    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ⚙️ API REST Directa
server {
    listen 443 ssl;
    server_name api.sansahbikes.com;

    ssl_certificate /etc/letsencrypt/live/sansahbikes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sansahbikes.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
